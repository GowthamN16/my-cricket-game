<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
:root{--bg:#eef2e6;--pan:#fff;--ink:#12261d;--mute:#5a6d63;--acc:#1d6fa5;--bad:#c4372c;--gold:#b7791f;--ln:rgba(0,0,0,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1713;--pan:#15271f;--ink:#eaf3ea;--mute:#9db3a7;--acc:#5bb6ea;--bad:#ff7b6e;--gold:#f0c060;--ln:rgba(255,255,255,.15)}}
:root[data-theme="dark"]{--bg:#0c1713;--pan:#15271f;--ink:#eaf3ea;--mute:#9db3a7;--acc:#5bb6ea;--bad:#ff7b6e;--gold:#f0c060;--ln:rgba(255,255,255,.15)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;user-select:none}
#hud{padding:8px 14px 4px;background:var(--pan);border-bottom:1px solid var(--ln)}
.sc{font:700 1.9rem Georgia,serif}.sm{font-size:.82rem;color:var(--mute)}
#ov{display:flex;gap:5px;min-height:24px;margin-top:3px}#ov i{font-style:normal;min-width:22px;text-align:center;border-radius:11px;background:var(--ln);font-size:.78rem;padding:2px 0}#ov .w{background:var(--bad);color:#fff}#ov .f{background:var(--gold);color:#fff}
#cv{flex:1;min-height:0;position:relative}canvas{position:absolute;inset:0;width:100%;height:100%}
#ctl{background:var(--pan);border-top:1px solid var(--ln);padding:10px 12px;min-height:150px}
.row{display:flex;gap:8px;margin:6px 0}.row>*{flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 6px;background:var(--acc);color:#fff}
button.o{background:var(--pan);color:var(--ink);border:2px solid var(--acc)}button.on{background:var(--acc);color:#fff}
button.big{width:100%;padding:18px;font-size:1.1rem}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid var(--ink)}
.tr{position:relative;height:26px;border-radius:13px;background:var(--ln);margin:6px 0 10px;overflow:hidden}.zn{position:absolute;left:35%;width:30%;top:0;bottom:0;background:#2f8f52;opacity:.7}#mk{position:absolute;top:3px;bottom:3px;width:8px;border-radius:4px;background:var(--ink);left:0}
#menu{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:18px;z-index:5;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#menu h1{font:700 2.2rem Georgia,serif;margin:.2em 0}#menu .rc{display:block;width:100%;text-align:left;background:var(--pan);color:var(--ink);border:2px solid var(--acc);margin:10px 0;padding:14px}#menu small{display:block;font-weight:400;color:var(--mute)}
#pb{position:absolute;top:8px;right:8px;z-index:4;padding:8px 14px;background:var(--pan);color:var(--ink);border:2px solid var(--acc);display:none}
#pop{position:absolute;left:0;right:0;top:12%;text-align:center;font:800 2rem Georgia,serif;text-shadow:0 2px 6px #000;pointer-events:none;z-index:3;display:none}
#hint{position:absolute;bottom:14%;font-size:2.6rem;color:#ffe066;transform:translateX(-50%);display:none;z-index:3;pointer-events:none}
#pm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}#pm .pn{background:var(--pan);border-radius:16px;padding:20px;width:min(340px,90vw)}#pm button{width:100%;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="hud"></div><div class="sm" id="cm" style="padding:2px 14px;min-height:18px"></div>
<div id="cv"><canvas id="c" style="display:none"></canvas><canvas id="c3"></canvas><button id="pb" onclick="pause()">II Pause</button><div id="pop"></div><div id="hint"></div><div id="menu"></div></div>
<div id="ctl"></div>
<div id="pm"><div class="pn"><h2 style="font-family:Georgia,serif;margin:.1em 0 .4em">Paused</h2><button onclick="resume()">Resume</button><button class="o" id="pv" onclick="flip()"></button><button class="o" id="ps" onclick="SND=!SND;this.textContent='Sound: '+(SND?'on':'off')">Sound: on</button><button class="o" id="pq" onclick="quit()">Quit to menu</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),rnd=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),sleep=ms=>tween(ms,()=>{});let pausedAt=0,pausedTot=0,qc=0;const gnow=()=>(pausedAt||performance.now())-pausedTot;
const WKT=11;let SAGA=null,DIF=1,OPP='CPU XI',MS={bnd:0},K={role:null,xp:0,ch:0,st:[]},AC=null,SND=1;
try{K=Object.assign(K,JSON.parse(localStorage.getItem('rcsaga')||'{}'))}catch(e){}
const saveK=()=>{try{localStorage.setItem('rcsaga',JSON.stringify(K))}catch(e){}},LV=()=>Math.min(10,1+(K.xp/100|0));
const CH=[{n:'Gully Cricket',o:2,d:.8,opp:'Lane 7 Boys',t:'A tennis ball, a tin-can wicket and one big dream. Win the street final.',e:'The whole lane chants your name.'},
{n:'District Trials',o:3,d:.95,opp:'District Hawks',t:'Scouts sit in the stands. One good day can change everything.',e:'A scout scribbles your name in his notebook.'},
{n:'State Semi-Final',o:5,d:1.1,opp:'State Lions',t:'Floodlights, a real crowd, and nerves you have never felt before.',e:'You are now a name the papers print.'},
{n:'Under-19 Cup',o:5,d:1.25,opp:'Young Warriors',t:'The best juniors in the land. Every ball is watched by selectors.',e:'The national call-up letter arrives.'},
{n:'Test Debut Series',o:5,d:1.4,opp:'Southern Kings',t:'Whites on, nation watching. Prove you belong at the top level.',e:'Debut done. Legends nod in respect.'},
{n:'World Cup Final',o:10,d:1.6,opp:'World Champions XI',t:'A billion people. One last match. Write your legend.',e:'You lift the trophy. The saga is complete.'}];
const CM={4:['Cracked through the covers!','Races away to the fence!','Pure timing, gorgeous!'],6:['That is out of the ground!','Massive! The crowd erupts!'],0:['Solid defence.','Beaten! So close.'],w:['Timber! Stumps shattered!','Gone! Huge breakthrough!','The batter trudges off.'],1:['Nudged for a quick single.','Finds the gap.'],2:['Two easy runs.'],3:['Superb running, three!']};
const com=o=>say(rnd(CM[o.w?'w':o.r]||CM[1]));
function sfx(k){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const c=k==='cheer',n=AC.sampleRate*(c?1.6:.15)|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(c?Math.sin(Math.PI*i/n):1-i/n);const r=AC.createBufferSource();r.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=k==='hit'?1800:700;const g=AC.createGain();g.gain.value=c?.35:.5;r.connect(f);f.connect(g);g.connect(AC.destination);r.start()}catch(e){}}
let OVERS=5,role,inn,S,target,tapFn=null,pop={t:0},B={v:0,x:180,y:150,z:0},P={bw:[180,122],sw:0,knock:0,kx:180,hint:null,ba:null},mOn=0,mT=0,mp=.5,selT='Fast',selL='Stump',lastT='';
const MAXB=()=>OVERS*6;
const TYPES={Fast:{dur:850,bp:.7,wk:.10,runs:[0,1,2,4]},Yorker:{dur:800,bp:.9,wk:.15,runs:[0,1,1,2]},Bouncer:{dur:900,bp:.5,wk:.12,runs:[0,1,4,6]},Spin:{dur:1250,bp:.65,wk:.13,runs:[0,0,1,2,4]}};
const LINES={Off:14,Stump:0,Leg:-14};
const FP=[[212,368],[280,310],[285,235],[240,185],[120,185],[75,235],[80,310],[140,385],[180,62]];let F=FP.map(p=>p.slice());
const SH={Defend:{risk:.02,runs:[0,1]},Drive:{risk:.08,runs:[1,2,4]},Loft:{risk:.18,runs:[2,4,6]},Slog:{risk:.28,runs:[0,4,6,6]}};
const acc=p=>cl(1-Math.abs(p-.5)*2,0,1);
const tween=(ms,f)=>new Promise(res=>{const s=gnow();(function k(){const t=cl((gnow()-s)/ms,0,1);f(t);t<1?requestAnimationFrame(k):res()})()});
const popup=(s,c)=>{pop={t:gnow()+1500,s,c:c||'#fff'};if(/FOUR!|SIX|BOWLED|CAUGHT!|CAUGHT B|LBW|STUMPED|GREAT/.test(s))sfx('cheer')};
const say=t=>$('cm').textContent=t;
const ask=h=>new Promise(r=>{$('ctl').innerHTML=h;tapFn=v=>{tapFn=null;r(v)}});
$('ctl').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-v]');if(b&&tapFn){e.preventDefault();tapFn(b.dataset.v)}});

/* ---------- drawing ---------- */
const cv=$('c'),x=cv.getContext('2d');
function ell(cx,cy,rx,ry){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7)}
function fig(px,py,c){x.fillStyle=c;x.strokeStyle='#0008';x.lineWidth=1;x.beginPath();x.arc(px,py,6,0,7);x.fill();x.stroke()}
function draw(){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);const s=Math.min(w/360,h/470);x.translate((w-360*s)/2,(h-470*s)/2);x.scale(s,s);
  x.save();ell(180,240,172,228);x.clip();for(let i=0;i<8;i++){x.fillStyle=i%2?'#347f49':'#2c7440';x.fillRect(0,i*60,360,60)}x.restore();
  x.strokeStyle='#fff';x.lineWidth=3;ell(180,240,172,228);x.stroke();
  x.setLineDash([5,6]);x.lineWidth=1.5;x.strokeStyle='#fff8';ell(180,240,100,135);x.stroke();x.setLineDash([]);
  x.fillStyle='#cfae74';x.fillRect(171,140,18,200);x.fillStyle='#fff';x.fillRect(166,150,28,2);x.fillRect(166,330,28,2);
  for(const sy of[134,341])for(const sx of[176,180,184]){x.fillStyle=P.knock&&sy===341?'#d33':'#f4e4b0';x.fillRect(sx-.7+(P.knock&&sy===341?(sx-180)*2:0),sy,1.6,7)}
  const mine=S?S.mine:1,bc=mine?'#4aa3df':'#f08a2c',fc=mine?'#f08a2c':'#4aa3df';
  F.forEach(p=>fig(p[0],p[1],fc));fig(P.kx,368,fc);fig(P.bw[0],P.bw[1],fc);fig(176,326,bc);
  x.save();x.translate(176,326);x.rotate(-1.5+P.sw*2.8);x.fillStyle='#8a5a2b';x.fillRect(-1.5,0,3,15);x.restore();
  if(B.v){x.fillStyle='#0006';x.beginPath();x.ellipse(B.x,B.y,3,1.6,0,0,7);x.fill();x.fillStyle='#fff';x.strokeStyle='#c22';x.lineWidth=1.2;x.beginPath();x.arc(B.x,B.y-B.z,3.4,0,7);x.fill();x.stroke()}
}
requestAnimationFrame(function L(){VIEW===3?draw3():draw();
  if(mOn){mp=(1-Math.cos((gnow()-mT)/1100*Math.PI*2))/2;const m=$('mk');if(m)m.style.left=`calc(${mp*100}% - ${mp*8}px)`}
  const pe=$('pop');if(pop.t>gnow()){pe.textContent=pop.s;pe.style.color=pop.c;pe.style.display='block'}else pe.style.display='none';
  const hn=$('hint');if(P.hint!==null){hn.style.display='block';hn.style.left=50+P.hint*20+'%';hn.textContent=['◀','▲','▶'][P.hint+1]}else hn.style.display='none';
  requestAnimationFrame(L)});

/* ---------- ball physics / animation ---------- */
async function deliver(type,line,onT){
  const T=TYPES[type],off=LINES[line];F=FP.map(p=>p.slice());P.knock=0;P.kx=180;P.sw=0;P.hint=null;CAM=0;
  say(`${type} delivery, ${line} line`);
  await tween(450,t=>{P.bw=[180,122+26*t];P.ba=-6.28*t});P.ba=null;B.v=1;
  await tween(T.dur,t=>{onT&&onT(t);B.x=180+off*t;B.y=150+176*t;const k=(t-T.bp)/(1-T.bp);B.z=t<T.bp?9*(1-t/T.bp):9*Math.sin(Math.PI*k)*(type==='Bouncer'?.9:.45)*(1-k*.6)});
  P.bw=[180,122];
}
const flyTo=(x1,y1,ms,arc,chase)=>{const x0=B.x,y0=B.y;let ci=-1,c0;
  if(chase){let d=1e9;F.forEach((p,i)=>{const dd=Math.hypot(p[0]-x1,p[1]-y1);if(dd<d){d=dd;ci=i}});c0=F[ci].slice()}
  return tween(ms,t=>{B.x=x0+(x1-x0)*t;B.y=y0+(y1-y0)*t;B.z=arc*Math.sin(Math.PI*t);if(ci>=0){F[ci][0]=c0[0]+(x1-c0[0])*t*.92;F[ci][1]=c0[1]+(y1-c0[1])*t*.92}})};
async function play(o){
  B.v=1;const RED='#ff5a4f';CAM=(!o.w&&o.r>0)||(o.w&&o.how==='Caught')?1:0;sfx('hit');SHK=o.w||o.r>=4?1:.25;
  if(o.w){
    if(o.how==='Bowled'||o.how==='LBW'||o.how==='Stumped'){if(o.how==='Bowled')P.knock=1;await flyTo(180,346,220,0);popup(o.how.toUpperCase()+'!',RED)}
    else if(o.how==='Caught behind'){await flyTo(180,368,320,4);popup('CAUGHT BEHIND!',RED)}
    else{const p=rnd(FP.slice(1,8));await flyTo(p[0],p[1],800,16,1);popup('CAUGHT!',RED)}
  }else if(o.r===0){await flyTo(180+rnd([-16,0,16]),305,320,2);popup('DOT BALL','#fff')}
  else{
    const th=(Math.random()*300-150)*Math.PI/180,k=o.r>=6?1.03:o.r>=4?1:o.r===3?.7:o.r===2?.5:.32;
    const ex=180+168*k*Math.sin(th),ey=240-224*k*Math.cos(th),ms=Math.hypot(ex-B.x,ey-B.y)*2.6+200;
    await flyTo(ex,ey,ms,o.r>=6?46:o.r>=4?6:3,o.r<4);
    popup(o.r===4?'FOUR!':o.r===6?'SIX!':o.r+(o.r>1?' RUNS':' RUN'),o.r>=4?'#f2c14e':'#fff');
  }
  await sleep(650);CAM=0;B.v=0;P.sw=0;P.knock=0;P.hint=null;F=FP.map(p=>p.slice());P.kx=180;
}
function apply(o,legal=1){
  com(o);if(S.mine&&role==='bat'&&o.r>=4)MS.bnd++;
  if(legal)S.b++;
  if(o.w){S.w++;S.over.push('W');if(S.mine&&role==='bat')S.cur={r:0,b:0};if(!S.mine&&role==='bowl'){S.bw.w++;S.bw.b++}}
  else{S.runs+=o.r;S.over.push(o.r);if(S.mine&&role==='bat'){S.cur.r+=o.r;S.cur.b++}if(!S.mine&&role==='bowl'){S.bw.r+=o.r;S.bw.b++}}
  hud();
}
const autoBall=()=>Math.random()<(S.mine?.06*DIF:.06/DIF)?{w:1,how:rnd(['Bowled','LBW','Caught'])}:{r:!S.mine&&Math.random()<(DIF-1)*.15?rnd([4,6]):rnd([0,0,0,1,1,1,1,2,2,3,4,4,6])};

/* ---------- three roles ---------- */
async function batBall(){
  const type=rnd(Object.keys(TYPES)),line=rnd(Object.keys(LINES));let cur=0,tapT=null;
  $('ctl').innerHTML=`<div class="sm">Tap a shot as the ball reaches the bat.</div><div class="row">${Object.keys(SH).map(k=>`<button data-v="${k}">${k}</button>`).join('')}</div>`;
  let shot=null;tapFn=v=>{if(tapT===null){tapT=cur;shot=v;tween(260,t=>P.sw=t)}};
  await deliver(type,line,t=>cur=t);tapFn=null;
  let o;
  if(tapT===null){o=Math.random()<.6?{w:1,how:rnd(['Bowled','LBW'])}:{r:0}}
  else{const q=cl(1-Math.abs(tapT-.93)/(.2+.012*LV()),0,1),sh=SH[shot];
    if(q<.1)o=Math.random()<.5?{w:1,how:rnd(['Bowled','LBW'])}:{r:0};
    else if(Math.random()<sh.risk+(1-q)*.35+(DIF-1)*.06)o={w:1,how:rnd(['Caught','Caught','Bowled','LBW'])};
    else o={r:q<.25?0:sh.runs[Math.floor(cl(q*.7+Math.random()*.5,0,.999)*sh.runs.length)]}}
  await play(o);apply(o);
}
function pickHTML(){const b=(o,sel)=>Object.keys(o).map(k=>`<button class="${k===sel?'on':'o'}" data-v="${k}">${k}</button>`).join('');
  return `<div class="row">${b(TYPES,selT)}</div><div class="row">${b(LINES,selL)}</div><button class="big" data-v="go">Run in and bowl</button>`}
async function bowlBall(){
  for(;;){const v=await ask(pickHTML());if(v==='go')break;if(TYPES[v])selT=v;else selL=v}
  mOn=1;mT=gnow();
  await ask(`<div class="sm">Release when the marker is in the green zone.</div><div class="tr"><div class="zn"></div><div id="mk"></div></div><button class="big" data-v="r">RELEASE</button>`);
  const q=cl(acc(mp)+.02*LV(),0,1);mOn=0;$('ctl').innerHTML='<div class="sm">Ball on its way...</div>';
  if(q<.12){await deliver(selT,'Leg');say('Wide!');popup('WIDE','#fff');S.runs++;S.over.push('Wd');await sleep(600);B.v=0;hud();return}
  await deliver(selT,selL);
  const T=TYPES[selT];let wk=T.wk*(.4+q*1.4)*({Stump:1.3,Off:1,Leg:.7}[selL])*(selT===lastT?.6:1)/DIF;lastT=selT;let o;
  if(Math.random()<wk)o={w:1,how:selL==='Stump'?'Bowled':selL==='Off'?rnd(['Caught behind','Caught']):rnd(['LBW','Caught'])};
  else o={r:T.runs[Math.floor(Math.random()*(1-q*.6)*T.runs.length)]};
  if(!o.w&&Math.random()<(DIF-1)*.12)o.r=rnd([4,6]);
  await play(o);apply(o);
}
async function keepBall(){
  const type=rnd(Object.keys(TYPES)),line=rnd(Object.keys(LINES)),r=Math.random();
  $('ctl').innerHTML='<div class="sm">Stay alert behind the stumps...</div>';
  await deliver(type,line);
  const ev=r<.14?'edge':r<.22?'stump':0;
  if(!ev){const o=autoBall();await play(o);apply(o);return}
  const d=rnd([-1,0,1]);popup(ev==='edge'?'EDGE!':'OUT OF CREASE!','#f2c14e');P.hint=d;
  const ft=flyTo(180+d*34,368,ev==='edge'?1000:600,10);
  const ans=await Promise.race([ask(`<div class="sm">Follow the arrow, then tap fast!</div><div class="row"><button data-v="-1">◀ Left</button><button data-v="0">Centre</button><button data-v="1">Right ▶</button></div>`),sleep((ev==='edge'?1100:800)+LV()*40).then(()=>null)]);
  tapFn=null;if(ans!==null)tween(150,t=>P.kx=180+ +ans*34*t);await ft;
  let o;
  if(ans!==null&&+ans===d){o={w:1,how:ev==='edge'?'Caught behind':'Stumped'};S.keep++;popup(ev==='edge'?'GREAT CATCH!':'STUMPED!','#7dff9b')}
  else{o={r:ev==='edge'?4:1};popup(ev==='edge'?'DROPPED! FOUR BYES':'MISSED! BYE','#ff5a4f');if(ev==='edge')await flyTo(180+d*100,455,500,4)}
  await sleep(700);B.v=0;F=FP.map(p=>p.slice());P.kx=180;P.hint=null;apply(o);
}

/* ---------- match flow ---------- */
const over=()=>S.b>=MAXB()||S.w>=WKT||(inn===2&&S.runs>target);
function hud(){
  const l2=inn===2?`Need ${Math.max(0,target+1-S.runs)} off ${MAXB()-S.b} balls`:'First innings';
  const me=role==='bat'&&S.mine?`Batter ${Math.min(S.w+1,WKT)}: ${S.cur.r} (${S.cur.b})`:role==='bowl'&&!S.mine?`Your figures: ${S.bw.w}/${S.bw.r} in ${S.bw.b/6|0}.${S.bw.b%6}`:role==='keep'&&!S.mine?`Dismissals by you: ${S.keep}`:'Your role is off. Auto-playing.';
  $('hud').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="sc">${S.runs}/${S.w}</span><span>${S.b/6|0}.${S.b%6} / ${OVERS} overs</span></div><div class="sm">${S.mine?'Your XI':OPP} batting. ${l2}</div><div class="sm">${me}</div><div id="ov">${S.over.slice(-7).map(v=>`<i class="${v==='W'?'w':v>=4?'f':''}">${v}</i>`).join('')}</div>`;
}
function menu(h){$('pb').style.display='none';$('menu').style.display='block';$('menu').innerHTML=h}
function home(){SAGA=null;DIF=1;OPP='CPU XI';
  S={runs:0,w:0,b:0,mine:1,over:[],cur:{r:0,b:0},bw:{w:0,r:0,b:0},keep:0};hud();$('ctl').innerHTML='';say('');
  menu(`<h1>Role Cricket</h1><button class="rc" onclick="saga()" style="border-color:var(--gold)">Career Saga<small>Rise from gully cricket to a World Cup final. Earn stars, level up, unlock chapters.</small></button><p>Quick match: 11 players a side. You play <b>one role</b>; the CPU handles everything else.</p>
  <div class="row">${[2,5,10].map(o=>`<button class="${o===OVERS?'on':'o'}" onclick="OVERS=${o};home()">${o} overs</button>`).join('')}</div>
  <div class="row"><button class="${VIEW===3?'on':'o'}" onclick="setView(3);home()">3D view</button><button class="${VIEW===2?'on':'o'}" onclick="setView(2);home()">2D view</button></div>
  <button class="rc" onclick="start('bat')">Batsman<small>Face every ball while your XI bats.</small></button>
  <button class="rc" onclick="start('bowl')">Bowler<small>Bowl every ball until the CPU collapses or overs end.</small></button>
  <button class="rc" onclick="start('keep')">Wicketkeeper<small>Catch edges and stump batters when the CPU bats.</small></button>`)}
function start(r){role=r;inn=1;MS={bnd:0};innings()}
async function innings(){
  S={runs:0,w:0,b:0,mine:inn===1,over:[],cur:{r:0,b:0},bw:{w:0,r:0,b:0},keep:0,ov:0};hud();say('');
  const active=(S.mine&&role==='bat')||(!S.mine&&role!=='bat');
  if(active){$('menu').style.display='none';$('pb').style.display='block';
    while(!over()){B.v=0;if(S.mine)await batBall();else if(role==='bowl')await bowlBall();else await keepBall();
      if(S.b%6===0&&S.b!==S.ov){S.ov=S.b;S.over=[];hud();popup('END OF OVER','#fff');await sleep(700)}}
  }else{while(!over())apply(autoBall());say('Auto-played innings')}

function finish(){
  const who=S.mine?'Your XI':OPP,line=`${who}: ${S.runs}/${S.w} in ${S.b/6|0}.${S.b%6} overs`;

    menu(`<h1>${t}</h1><p>${line}</p><p>Your XI scored ${target}.</p>${st}${sagaEnd()}`)}
}

/* ---------- career saga ---------- */

function saga(){
  if(!K.role){menu('<h1>Career Saga</h1><p>Pick the role you will master. It stays yours for the whole career.</p>'+[['bat','Batsman'],['bowl','Bowler'],['keep','Wicketkeeper']].map(([r,n])=>`<button class="rc" onclick="K.role='${r}';saveK();saga()">${n}</button>`).join('')+'<button class="big o" onclick="home()">Back</button>');return}
  const R={bat:'Batsman',bowl:'Bowler',keep:'Wicketkeeper'}[K.role];
  menu(`<h1>Career Saga</h1><p>${R}, level <b>${LV()}</b> (XP ${K.xp%100}/100). Each level sharpens your timing.</p>`+CH.map((c,i)=>{const lk=i>K.ch,st=K.st[i]||0;return `<button class="rc" ${lk?'disabled style="opacity:.45"':`onclick="sagaGo(${i})"`}>${i+1}. ${c.n} ${'★'.repeat(st)}${'☆'.repeat(3-st)}<small>${lk?'Locked. Win the previous chapter.':c.t}</small></button>`}).join('')+'<button class="big o" onclick="home()">Back</button><button class="big o" style="margin-top:8px" onclick="if(confirm(\'Reset your career?\')){K={role:null,xp:0,ch:0,st:[]};saveK();saga()}">Reset career</button>')}

function sagaStart(i){role=K.role;OVERS=CH[i].o;DIF=CH[i].d;OPP=CH[i].opp;SAGA=i;inn=1;MS={bnd:0};innings()}
function sagaEnd(){
  if(SAGA===null)return '<button class="big" onclick="home()">Play again</button>';
  const i=SAGA,win=S.runs<target,personal=role==='bat'?MS.bnd:role==='bowl'?S.bw.w:S.keep,obj=personal>=goal(i),big=win&&target-S.runs>=12+i*3;

  return `<p><b>${win?'Victory!':'Defeat.'}</b> ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}<br>Win ${win?'✓':'✗'}, goal (${personal}/${goal(i)}) ${obj&&win?'✓':'✗'}, big margin ${big?'✓':'✗'}. +${xp} XP${LV()>pv?`<br><b>Level up! You are now level ${LV()}.</b>`:''}</p>${win?`<p><i>${CH[i].e}</i></p>`:''}<button class="big" onclick="${win&&i<CH.length-1?`sagaGo(${i+1})`:win?'saga()':`sagaStart(${i})`}">${win&&i<CH.length-1?'Next chapter':win?'Career hall':'Try again'}</button><button class="big o" style="margin-top:8px" onclick="saga()">Career menu</button>`}
